<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>markmyword</title>
  <style>
    /* Inkling-style minimalism: warm off-white ground, near-black ink, one
       restrained accent, a serif reading face, generous whitespace, almost no
       chrome. Iowan Old Style is native on macOS; Georgia is the fallback. */
    :root {
      --ink:#1c1b19; --ink-2:#57534e; --ink-3:#8a857e;
      --bg:#faf9f5; --line:#e9e5db; --accent:#0066cc;
      --serif:'Iowan Old Style','Iowan Old Style BT',Georgia,'Times New Roman',serif;
      --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      --mono:'SF Mono','Monaco','Inconsolata',ui-monospace,monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased; }

    main { max-width:600px; margin:0 auto; padding:88px 24px 96px; }

    .brand { font-family: var(--serif); font-weight:600; font-size:19px;
      letter-spacing:-.01em; color: var(--ink); }
    .brand .tag { color: var(--ink-3); font-style:italic; font-weight:400; font-size:15px; margin-left:8px; }

    h1 { font-family: var(--serif); font-weight:600; font-size:34px;
      letter-spacing:-.02em; margin:56px 0 8px; }
    .lede { font-family: var(--serif); font-size:18px; line-height:1.55;
      color: var(--ink-2); margin:0 0 36px; max-width:52ch; }

    /* File list — plain rows, no cards. */
    .docs { list-style:none; margin:0 0 44px; padding:0; }
    .docs li { position:relative; display:flex; align-items:center;
      border-bottom:1px solid var(--line); }
    .docs li:first-child { border-top:1px solid var(--line); }
    .doc-open { flex:1; display:flex; align-items:center; gap:11px;
      text-decoration:none; color: var(--ink); padding:15px 4px; font-size:16px; }
    .doc-open:hover { color: var(--accent); }
    .doc-open .ic { color: var(--ink-3); display:inline-flex; flex:none; }
    .doc-open:hover .ic { color: var(--accent); }
    .doc-del { flex:none; width:30px; height:30px; padding:0; border:0; background:none;
      color: var(--ink-3); font-size:20px; line-height:1; cursor:pointer; border-radius:6px;
      opacity:0; transition: opacity .12s, color .12s, background-color .12s; }
    .docs li:hover .doc-del { opacity:1; }
    .doc-del:hover { color:#c0392b; background:#f7ece9; }
    .doc-del:focus-visible { opacity:1; outline:2px solid var(--accent); }
    .empty { color: var(--ink-3); font-family: var(--serif); font-style:italic;
      font-size:16px; padding:6px 0 30px; }

    /* The single drop zone. */
    .drop { display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:6px; min-height:168px; padding:28px; text-align:center; cursor:pointer;
      border:1.5px dashed #d3cdbf; border-radius:14px; background:#fffdf8;
      color: var(--ink-2); transition: border-color .14s, background-color .14s; }
    .drop:hover, .drop.drag { border-color: var(--accent); background:#f4f8fd; }
    .drop:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .drop .ic { color: var(--ink-3); margin-bottom:4px; }
    .drop .big { font-size:16px; color: var(--ink); }
    .drop .sub { font-size:13.5px; color: var(--ink-3); }
    .drop input[type=file] { display:none; }

    /* Paste-HTML: hidden behind a link, revealed inline. */
    .paste-link { display:block; text-align:center; margin:16px 0 0;
      font-size:13.5px; color: var(--ink-3); background:none; border:0; cursor:pointer; }
    .paste-link:hover { color: var(--accent); }
    .paste { display:none; margin-top:16px; }
    .paste.show { display:block; }
    .paste textarea { width:100%; min-height:150px; border:1px solid var(--line);
      border-radius:10px; padding:13px; font-family: var(--mono); font-size:13px;
      line-height:1.5; color: var(--ink); background:#fffdf8; resize:vertical; }
    .paste textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
    .paste .row { display:flex; align-items:center; gap:12px; margin-top:12px; }
    .paste input[type=text] { flex:1; border:1px solid var(--line); border-radius:8px;
      padding:9px 11px; font-family: var(--mono); font-size:13.5px; color: var(--ink); background:#fffdf8; }
    .paste input[type=text]:focus { outline:2px solid var(--accent); border-color:transparent; }
    button.primary { background: var(--ink); color: var(--bg); border:1px solid var(--ink);
      border-radius:8px; padding:9px 18px; font-size:13.5px; font-weight:600; cursor:pointer;
      display:inline-flex; align-items:center; gap:7px; }
    button.primary:hover { background:#000; }
    button.primary:disabled { opacity:.5; cursor:not-allowed; }

    .msg { margin-top:18px; padding:11px 14px; border-radius:9px; font-size:14px; display:none; }
    .msg.show { display:block; }
    .msg.err { background:#f9ebe9; color:#8a1c1c; border:1px solid #eed4d0; }
    .msg.ok { background:#eaf3ea; color:#1c5c1c; border:1px solid #d2e6d2; }
    .msg a { color: inherit; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <span class="brand">markmyword<span class="tag">review HTML files</span></span>

    <h1>Your files</h1>
    <p class="lede">Open one to review — edit in place, or suggest changes and
      comments. History is kept automatically.</p>

    <ul id="docs" class="docs"><li class="empty">Loading…</li></ul>

    <!-- Single drop zone: choose or drop an .html file; the name comes from the
         filename. Advanced: a paste-HTML box hides behind the link below. -->
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add an HTML file">
      <span class="ic" id="drop-ic"></span>
      <span class="big">Drop an <b>.html</b> file here</span>
      <span class="sub">or click to choose</span>
      <input id="file" type="file" accept=".html,text/html" />
    </div>

    <button class="paste-link" id="paste-toggle">or paste HTML instead</button>

    <div class="paste" id="paste">
      <textarea id="paste-html" placeholder="<!doctype html>&#10;<html>…"></textarea>
      <div class="row">
        <input id="paste-id" type="text" placeholder="name (becomes the URL)" autocomplete="off" spellcheck="false" />
        <button class="primary" id="paste-btn"><span class="ic" id="paste-ic"></span>Add &amp; open</button>
      </div>
    </div>

    <div class="msg" id="msg"></div>
  </main>

  <script type="module" src="/index.js"></script>
</body>
</html>
